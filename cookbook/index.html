<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Norton Fakler Cookbook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <span class="logo">Norton Fakler Cookbook</span>
  </header>

  <section class="hero">
    <h1>What are we making today?</h1>
    <p>A small collection of recipes worth keeping.</p>
    <div class="search-wrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="search" aria-label="Search recipes or ingredients" placeholder="Search recipes or ingredients...">
    </div>
  </section>

  <div class="filters">
    <div class="filter-group">
      <span class="filter-label">Cook</span>
      <div class="bar" id="personBar"></div>
    </div>
    <div class="filter-group">
      <span class="filter-label">Tags</span>
      <div class="bar" id="tagBar"></div>
    </div>
  </div>

  <div class="container">
    <div class="results-bar">
      <div class="results-count" id="resultsCount" aria-live="polite"></div>
      <div class="legend"><span class="legend-est">~</span> estimated — not from the original recipe</div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <footer>Made with 🧂 &amp; ❤️ by <a href="https://tymakesstuff.com">TyMakesStuff</a></footer>

  <div class="backdrop" id="backdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" aria-label="Close">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="cookmode" id="cookmode" role="dialog" aria-modal="true" aria-label="Cook mode" aria-hidden="true">
    <div class="cm-top">
      <span class="cm-title" id="cmTitle"></span>
      <button class="cm-exit" id="cmExit">✕ Exit</button>
    </div>
    <div class="cm-progress-track"><div class="cm-progress" id="cmProgress"></div></div>
    <div class="cm-stepwrap" id="cmStepwrap">
      <div class="cm-counter" id="cmCounter"></div>
      <div class="cm-step" id="cmStep"></div>
      <div class="cm-hint">Tap, press →, or use Next to advance</div>
    </div>
    <div class="cm-nav">
      <button class="cm-prev" id="cmPrev">◀ Prev</button>
      <button class="cm-next" id="cmNext">Next ▶</button>
    </div>
    <details class="cm-ing" id="cmIngWrap">
      <summary>Ingredients</summary>
      <ul id="cmIngList"></ul>
    </details>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/recipes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
