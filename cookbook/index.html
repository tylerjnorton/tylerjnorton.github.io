<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Norton Fakler Cookbook</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <span class="logo">Norton Fakler Cookbook</span>
  </header>

  <section class="hero">
    <h1>What are we making today?</h1>
    <p>A small collection of recipes worth keeping.</p>
    <div class="search-wrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="search" placeholder="Search recipes or ingredients...">
    </div>
  </section>

  <div class="filters">
    <div class="filter-group">
      <span class="filter-label">Cook</span>
      <div class="bar" id="personBar"></div>
    </div>
    <div class="filter-group">
      <span class="filter-label">Tags</span>
      <div class="bar" id="tagBar"></div>
    </div>
  </div>

  <div class="container">
    <div class="results-count" id="resultsCount"></div>
    <div class="grid" id="grid"></div>
  </div>

  <footer>Made with 🧂 &amp; ❤️</footer>

  <div class="backdrop" id="backdrop">
    <div class="modal">
      <button class="modal-close" aria-label="Close">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="js/recipes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
